.valid-branch:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*hotfix.*/'  # Matches branches starting with 'hotfix/'
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

.deploy-k8s:
  environment:
    name: ${CI_COMMIT_BRANCH}
  image: 
    name: registry.bps.go.id/factory/oc-kustomize
    entrypoint: [""]
  before_script:
    - oc login --server=${K8S_CLUSTER} --token=${K8S_TOKEN}
    - oc project ${K8S_NS}
    - oc whoami
  script:
    - echo "Deploying ${IMAGE_TAG}"
    - kustomize version
    - cd ._k8s/${CI_COMMIT_BRANCH}
    - kustomize edit set image ${CI_REGISTRY_IMAGE}=${IMAGE_TAG}
    - kustomize build . | oc apply -f -

.release-job:
  #needs: ["get-version"]
  dependencies:
    - get-version
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never                                  # Do not run this job when a tag is created manually
    - if: '$CI_PIPELINE_SOURCE == "schedule"'
      when: never                                  # Do not run this job when scheduled pipeline
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Run this job when commits are pushed or merged to the default branch
  variables:
    CI_SERVER_URL: https://$CI_SERVER_HOST
  script:
    - echo "running release_job for ${VERSION}"
  release:                                         # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: 'v$VERSION'
    name: 'Release v$VERSION'
    description: 'Release created using the release-cli.'

.bump-gitops:
  #needs: ["build-image"]
  variables:
    APP: $CI_PROJECT_NAME
    APP_BRANCH: $CI_COMMIT_BRANCH
    VERSION: $VERSION
    IMAGE_TAG: $IMAGE_TAG
  trigger:
    project: ${CI_PROJECT_ROOT_NAMESPACE}/${CI_PROJECT_ROOT_NAMESPACE}-gitops
    strategy: depend