.valid-branch:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*hotfix.*/'  # Matches branches starting with 'hotfix/'
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

.release-job:
  needs: ["get-version"]
  image: registry.gitlab.com/gitlab-org/release-cli:latest
  rules:
    - if: $CI_COMMIT_TAG
      when: never                                  # Do not run this job when a tag is created manually
    - if: $CI_COMMIT_BRANCH == $CI_DEFAULT_BRANCH  # Run this job when commits are pushed or merged to the default branch
  variables:
    CI_SERVER_URL: https://$CI_SERVER_HOST
  script:
    - echo "running release_job for $VERSION"
  release:                                         # See https://docs.gitlab.com/ee/ci/yaml/#release for available properties
    tag_name: 'v$VERSION'
    name: 'Release v$VERSION'
    description: 'Release created using the release-cli.'

.bump-version:
  needs: ["get-version"]
  image: bitnami/git
  only:
    - development
    - main
  variables:
    GITOPS_REPO: https://gitlab-ci-token:${CI_JOB_TOKEN}@${CI_SERVER_HOST}/${CI_PROJECT_NAMESPACE}/${CI_PROJECT_NAMESPACE}-gitops
  before_script:
    - git config --global user.name "${GITLAB_USER_NAME}"
    - git config --global user.email "${GITLAB_USER_EMAIL}"
  script:
    - |
      echo "Cloning ${GITOPS_REPO}"
      git clone ${GITOPS_REPO}
      cd $CI_PROJECT_NAMESPACE-gitops/apps/$CI_PROJECT_NAME/envs
      if [ "$CI_COMMIT_BRANCH" == "development" ]; then find *dev -type f -name "version.yml" -exec sed -i "/^[[:space:]]*image:/s/:[^:]*$/:$VERSION/" {} +; fi
      if [ "$CI_COMMIT_BRANCH" == "main" ]; then find *prod -type f -name "version.yml" -exec sed -i "/^[[:space:]]*image:/s/:[^:]*$/:$VERSION/" {} +; fi
      git diff --quiet HEAD^ HEAD || (echo "Changes detected, proceeding with pipeline" && exit 0)
      git add .
      git commit -m "bump image version to $VERSION"
      git push ${GITOPS_REPO} HEAD:main