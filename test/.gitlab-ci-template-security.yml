.valid-branch:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*hotfix.*/'  # Matches branches starting with 'hotfix/'
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never
    
include:
#  - template: Jobs/Dependency-Scanning.gitlab-ci.yml
#  - template: Jobs/Secret-Detection.gitlab-ci.yml
#  - template: Jobs/SAST.gitlab-ci.yml
  - template: Jobs/Container-Scanning.gitlab-ci.yml
#  - template: Jobs/Container-Scanning.latest.gitlab-ci.yml

#override to always run secret detection
#secret_detection:
#  rules:
#    - when: always

#override to only run on valid-branch
#override stage to scan stage, run after build stage
container_scanning:
  rules:
    - !reference [.valid-branch, rules]
  stage: scan
  dependencies:
    - get-version
  variables:
    CS_IMAGE: $IMAGE_TAG
  before_script:
    - echo "Scanning image:" ${CS_IMAGE}
    - trivy image --slow --parallel 1 --no-progress ${CS_IMAGE}