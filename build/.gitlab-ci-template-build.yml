.valid-branch:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*hotfix.*/'  # Matches branches starting with 'hotfix/'
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

.get-version-laravel:
  rules:
    - !reference [.valid-branch, rules]
  image: registry.bps.go.id/mirror/busybox
  script: 
    - VERSION=$(grep \'version\' config/app.php | cut -d'>' -f2 | tr -d " ',")
    - if [[ "$CI_COMMIT_BRANCH" != "main" && "$CI_COMMIT_BRANCH" != hotfix* ]]; then VERSION="${CI_COMMIT_BRANCH}-${VERSION}-${CI_COMMIT_SHORT_SHA}"; fi
    - echo "Version $VERSION"
    - echo "VERSION=$VERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env

.build-buildah-image:
  rules:
    - !reference [.valid-branch, rules]
  image: registry.bps.go.id/cache/containers/aio
  needs: ["get-version"]
  variables:
    IMAGE_REPO: $QUAY_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME
    IMAGE_TAG: $IMAGE_REPO:$VERSION
  before_script:
    - echo "Logging into Quay Container Registry"
    - buildah login -u "$QUAY_USER" --password "$QUAY_PASSWORD" "$QUAY_REGISTRY"
  script:
    - echo "Building $IMAGE_TAG"
    #- buildah bud -t "$IMAGE_TAG"
    - buildah bud --cache-from ${IMAGE_REPO}-cache --tag ${IMAGE_TAG} --cache-to ${IMAGE_REPO}-cache --layers --storage-driver overlay2 --pull newer
    - echo "Pushing $IMAGE_TAG"
    - buildah push "$IMAGE_TAG"
    - echo "VERSION=$VERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env