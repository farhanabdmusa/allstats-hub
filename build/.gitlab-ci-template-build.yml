.valid-branch:
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*hotfix.*/'  # Matches branches starting with 'hotfix/'
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never

.get-version-txt:
  rules:
    - !reference [.valid-branch, rules]
  image: registry.bps.go.id/mirror/busybox
  script:
    - VERSION=$(cat version.txt)
    - if [[ "$CI_COMMIT_BRANCH" != "main" && "$CI_COMMIT_BRANCH" != hotfix* ]]; then VERSION="${VERSION}-${CI_COMMIT_SHORT_SHA}"; fi
    - IMAGE_TAG=${CI_REGISTRY_IMAGE}/${CI_COMMIT_BRANCH}:${VERSION}
    - echo "$CI_PROJECT_NAME Version is $VERSION"
    - echo "$CI_PROJECT_NAME Imagetag is $IMAGE_TAG"
    - echo "VERSION=$VERSION" >> build.env
    - echo "IMAGE_TAG=$IMAGE_TAG" >> build.env
  artifacts:
    reports:
      dotenv: build.env

.build-buildah-image:
  rules:
    - !reference [.valid-branch, rules]
  image: registry.bps.go.id/factory/aio-tools
  dependencies:
    - get-version
  before_script:
    - echo "Logging into Gitlab Container Registry"
    - buildah login -u "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
    - echo "Logging into Base Container Registry"
    - buildah login -u "$BASE_REGISTRY_USER" --password "$BASE_REGISTRY_PASSWORD" "$BASE_REGISTRY"
  script:
    - echo "Building $IMAGE_TAG"
    - |
      if [ "$CACHING" = "true" ]; then
        echo "Build caching is enabled."
        CACHE_FLAGS="--cache-to ${CI_REGISTRY_IMAGE}/cache --cache-from ${CI_REGISTRY_IMAGE}/cache --layers"
      fi
    - buildah bud --tag ${IMAGE_TAG} ${CACHE_FLAGS} --pull=newer --file Dockerfile.bps ${KODERIA_BUILD_ARGS}
    - echo "Pushing $IMAGE_TAG"
    - buildah push ${IMAGE_TAG}


.build-docker-image:
  rules:
    - !reference [.valid-branch, rules]
  image: registry.bps.go.id/mirror/docker
  dependencies:
    - get-version
  before_script:
    - echo "Logging into Gitlab Container Registry"
    - docker login --username "$CI_REGISTRY_USER" --password "$CI_REGISTRY_PASSWORD" "$CI_REGISTRY"
  script:
    - echo "Building $IMAGE_TAG"
    - docker build -t $IMAGE_TAG . --file Dockerfile.bps ${KODERIA_BUILD_ARGS}
    - echo "Pushing $IMAGE_TAG"
    - docker push ${IMAGE_TAG}