.get-version-php:
  image: php:8.2-cli
  rules:
    - if: '$CI_COMMIT_BRANCH =~ /.*hotfix.*/'  # Matches branches starting with 'hotfix/'
      when: always
    - if: $CI_COMMIT_BRANCH == "development"
      when: always
    - if: $CI_COMMIT_BRANCH == "staging"
      when: always
    - if: $CI_COMMIT_BRANCH == "main"
      when: always
    - when: never
  script: 
    - VERSION=$(grep '"version"' composer.json | cut -d':' -f2 | tr -d ' ",')
    - if [[ "$CI_COMMIT_BRANCH" != "main" && "$CI_COMMIT_BRANCH" != hotfix* ]]; then VERSION="${CI_COMMIT_BRANCH}-${VERSION}"; fi
    - echo "Version $VERSION"
    - echo "VERSION=$VERSION" >> build.env
  artifacts:
    reports:
      dotenv: build.env

.build-buildah-image:
  image: registry.bps.go.id/cache/containers/aio
  needs: ["get-version"]
  variables:
    IMAGE_TAG: $QUAY_REGISTRY/$CI_PROJECT_NAMESPACE/$CI_PROJECT_NAME:$VERSION
  before_script:
    - echo "Logging into Quay Container Registry"
    - buildah login -u "$QUAY_USER" --password "$QUAY_PASSWORD" "$QUAY_REGISTRY"
  script:
    - echo "Building $IMAGE_TAG"
    - buildah bud -t "$IMAGE_TAG"
    - echo "Pushing $IMAGE_TAG"
    - buildah push "$IMAGE_TAG"